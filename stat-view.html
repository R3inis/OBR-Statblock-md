<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; color: #fff; background: #2E3136; margin: 0; padding: 12px; font-size: 13px; }
    h2 { margin: 0 0 4px 0; font-size: 18px; color: #facc15; }
    .meta { font-style: italic; color: #9ca3af; margin-bottom: 8px; font-size: 11px; }
    hr { border: 0; border-top: 1px solid #4b5563; margin: 8px 0; }
    
    /* Ability Scores Table */
    .abilities-table { width: 100%; border-collapse: collapse; text-align: center; margin-bottom: 10px; }
    .abilities-table th, .abilities-table td { border: 1px solid #4b5563; padding: 4px; font-size: 11px; }
    .abilities-table th { background: #374151; color: #d1d5db; }

    /* Sections & Text */
    h4 { margin: 10px 0 4px 0; color: #60a5fa; font-size: 13px; border-bottom: 1px solid #374151; padding-bottom: 2px; }
    p { margin: 4px 0; line-height: 1.3; }

    /* Interactive rollable elements */
    .rollable { background: #374151; padding: 1px 4px; border-radius: 3px; cursor: pointer; color: #93c5fd; border: 1px solid #4b5563; }
    .rollable:hover { background: #4b5563; color: #bfdbfe; }
    .dc { background: #451a03; border-color: #78350f; color: #fde047; cursor: default; } /* DC is highlight only */
  </style>
</head>
<body>
  <div id="content">Select a token to view its stat block.</div>

  <script type="module" src="/src/stat-view.js"></script>
</body>
</html>
