<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      color: #fff;
      background: #2E3136;
      margin: 0;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h3 { margin: 0 0 8px 0; font-size: 15px; color: #facc15; text-align: center; }

    .toggle-box {
      background: #202225;
      border: 1px solid #40444b;
      border-radius: 6px;
      padding: 8px 10px;
      display: none; /* Hidden by default; enabled only for GM */
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #facc15;
      cursor: pointer;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    #clearBtn {
      background: transparent;
      border: 1px solid #52525b;
      color: #d4d4d8;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
    }
    #clearBtn:hover { background: #3f3f46; color: #fff; }

    #rollHistory {
      flex: 1;
      overflow-y: auto;
      background: #202225;
      border: 1px solid #40444b;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .roll-entry {
      background: #2b2d31;
      border-left: 3px solid #facc15;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.35;
      word-wrap: break-word;
    }
    .roll-entry.public { border-left-color: #4ade80; }
    .roll-time {
      display: block;
      font-size: 10px;
      color: #71717a;
      margin-bottom: 2px;
    }
    .empty-log {
      text-align: center;
      color: #71717a;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h3>Quick Statblock</h3>
  
  <div class="toggle-box" id="gmOnlyToggle">
    <span id="modeLabel">🤫 Private DM Rolls</span>
    <input type="checkbox" id="publicRollToggle">
  </div>

  <div class="history-header">
    <span>Roll History</span>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="rollHistory"></div>

  <script type="module">
    import OBR from "@owlbear-rodeo/sdk";

    OBR.onReady(async () => {
      const role = await OBR.player.getRole();
      const isGM = role === "GM";

      const gmToggleBox = document.getElementById("gmOnlyToggle");
      const toggle = document.getElementById("publicRollToggle");
      const label = document.getElementById("modeLabel");
      const historyContainer = document.getElementById("rollHistory");
      const clearBtn = document.getElementById("clearBtn");

      // 1. Show Public/Private Toggle strictly for GM
      if (isGM) {
        gmToggleBox.style.display = "flex";
        const isPublic = localStorage.getItem("qs_public_rolls") === "true";
        toggle.checked = isPublic;
        updateLabel(isPublic);

        toggle.addEventListener("change", (e) => {
          const checked = e.target.checked;
          localStorage.setItem("qs_public_rolls", checked);
          updateLabel(checked);
        });
      }

      function updateLabel(pub) {
        label.innerText = pub ? "Public Room Rolls" : "Private DM Rolls";
        label.style.color = pub ? "#4ade80" : "#facc15";
      }

      // 2. Render Roll History Feed (Players only ever receive public broadcasts)
      function renderHistory() {
        const history = JSON.parse(localStorage.getItem("qs_roll_history") || "[]");
        if (history.length === 0) {
          const emptyHint = isGM 
            ? "No rolls yet.<br/>Click any attack, save, or damage value in a stat block."
            : "No public rolls yet.";
          historyContainer.innerHTML = `<div class="empty-log">${emptyHint}</div>`;
          return;
        }

        historyContainer.innerHTML = history.map(item => `
          <div class="roll-entry ${item.isPublic ? 'public' : ''}">
            <span class="roll-time">${item.time}</span>
            ${item.text}
          </div>
        `).join("");
      }

      clearBtn.addEventListener("click", () => {
        localStorage.removeItem("qs_roll_history");
        renderHistory();
      });

      // Listen for cross-iframe updates (GM rolling from stat-view.js)
      window.addEventListener("storage", (e) => {
        if (e.key === "qs_roll_history") renderHistory();
      });

      // Listen for same-frame updates (Player receiving broadcast in main.js)
      window.addEventListener("qs_history_updated", renderHistory);

      renderHistory();
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
